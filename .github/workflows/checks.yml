name: Checks

# The four checks, in one place, called by both `check.yml` (pushes and pull
# requests) and `publish.yml` (releases). They were duplicated verbatim in the
# two workflows, which meant a new check had to be added twice — and a publish
# would silently skip it if only one copy was updated.
#
# `workflow_call` only: this never triggers on its own.
on:
  workflow_call:

jobs:
  checks:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # No `setup-node` step: `bun run` substitutes itself for the `node`
      # shebang on the oxlint, oxfmt and tsc bins, so the toolchain is Bun-only.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The pre-commit hook only sees staged files, so all four run on the whole
      # tree here.
      - name: Check formatting
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
